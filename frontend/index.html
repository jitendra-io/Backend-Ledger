<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger — Secure Banking</title>
    <meta name="description" content="Ledger Banking System — manage accounts, send money, and track transactions securely." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
    <!-- Animated background -->
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="auth-container">
        <!-- Logo -->
        <div class="logo">
            <div class="logo-box">
                <span class="logo-bracket">[</span>
                LEDGER
                <span class="logo-bracket">]</span>
            </div>
            <p class="logo-tagline">Secure Double-Entry Banking</p>
        </div>

        <!-- Tab Switch -->
        <div class="tab-row">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form" id="form-login" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" />
                    <button type="button" class="eye-btn" onclick="togglePass('login-password', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div id="login-error" class="form-error hidden"></div>
            <button type="submit" class="submit-btn" id="login-submit-btn">
                <span class="btn-text">Sign In</span>
                <span class="btn-spinner hidden"></span>
            </button>
            <p class="form-note">Don't have an account? <a href="#" onclick="switchTab('register')">Create one &rarr;</a></p>
        </form>

        <!-- REGISTER FORM -->
        <form class="auth-form hidden" id="form-register" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="John Doe" required autocomplete="name" />
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email" />
            </div>
            <div class="form-group">
                <label for="reg-password">Password <span class="hint">(min 6 chars)</span></label>
                <div class="input-wrap">
                    <input type="password" id="reg-password" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
                    <button type="button" class="eye-btn" onclick="togglePass('reg-password', this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>
            <div id="register-error" class="form-error hidden"></div>
            <button type="submit" class="submit-btn" id="register-submit-btn">
                <span class="btn-text">Create Account</span>
                <span class="btn-spinner hidden"></span>
            </button>
            <p class="form-note">Already have an account? <a href="#" onclick="switchTab('login')">Sign in &rarr;</a></p>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
